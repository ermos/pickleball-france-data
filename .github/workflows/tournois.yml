name: Update FFT tournaments

on:
  schedule:
    # off the hour: GitHub delays or drops scheduled runs at :00 under load
    - cron: "37 4 */3 * *" # every 3 days 04:37 UTC
  workflow_dispatch:

# Shared group across the 3 data workflows: they all push to main, so they run one at a time
concurrency:
  group: pickleball-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/fetch_tournois.sh
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "chore(data): update FFT pickleball tournaments" && git push)

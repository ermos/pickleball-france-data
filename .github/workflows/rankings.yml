name: Update FFT rankings

on:
  schedule:
    # off the hour: GitHub delays or drops scheduled runs at :00 under load
    - cron: "17 6 * * 1" # every Monday 06:17 UTC
  workflow_dispatch:

# Shared group across the 3 data workflows: they all push to main, so they run one at a time
concurrency:
  group: pickleball-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install pdfplumber==0.11.4 pytest
      - run: pytest -q scripts
      - run: python scripts/fetch_rankings.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "chore(data): update FFT pickleball rankings" && git push)
